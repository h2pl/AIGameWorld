# 商人 Actor / Merchant Actor — function: merchant + dialogue

id:                          # 唯一标识 / Unique ID
name:                        # 名称 / Name
role:                        # 职业/角色 / Class/Role
race:                        # 种族 / Race
  attributes:
    str:                       # 力量 / Strength
    dex:                       # 敏捷 / Dexterity
    con:                       # 体质 / Constitution
    int:                       # 智力 / Intelligence
    wis:                       # 感知 / Wisdom
    cha:                       # 魅力 / Charisma
  combat:
    hp:                        # 生命值 / Hit Points
    max_hp:                    # 最大生命值 / Max HP
    ac:                        # 护甲等级 / Armor Class
    attack_bonus:              # 攻击加值 / Attack Bonus
    damage_bonus:              # 伤害加值 / Damage Bonus
personality:                 # 性格 / Personality
functions:                   # 功能标签 / Function Tags
  function_data:
    merchant:
      gold: 300
      buyback_ratio: 0.5
    dialogue:
      dialogue_tree: "merchant_dialogue.yaml"
equipment:                   # 已装备 / Equipped Items
  inventory:
    - {item: "health_potion", qty: 3}
    - {item: "gold", qty: 100}
allowed_actions:            # 允许的行动 / Allowed Actions
