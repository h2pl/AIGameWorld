# SimGameWorld CI/CD Pipeline / 持续集成流水线
# 每次 push/PR 到 main 时自动运行 / Auto-runs on push/PR to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3       # uv 包管理器 / uv package manager
      - run: uv sync                       # 安装依赖 / Install deps
      - run: uv run ruff check .           # Lint 检查 / Lint check
      - run: uv run ruff format --check .  # 格式检查 / Format check
      - run: python .githooks/check-comments.py --all  # 注释检查 / Comment check
      - run: uv run mypy src/              # 类型检查 / Type check
      - run: uv run pytest --cov           # 测试 + 覆盖率 / Tests + coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install                   # 安装依赖 / Install deps
      - run: npx eslint src/               # Lint 检查 / Lint check
      - run: npx prettier --check src/     # 格式检查 / Format check
      - run: npx vitest run                # 运行测试 / Run tests
