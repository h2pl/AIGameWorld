# Elderwood Village 场景定义 / Scene definition
# 对应 tilemap: tuxemon-town.json (40x40 tiles, 32px)
id: "village_elderwood"
name: "Elderwood Village"
type: "village"
description: "A quiet border village, smoke rising from the blacksmith's chimney."
spawn:  # 出生点 / Spawn point
  x: 20
  y: 20
grid:  # 地图尺寸 / Map dimensions
  width: 40
  height: 40
  tile_size: 32
landmarks:
  - id: "blacksmith_shop"
    name: "Blacksmith"
    position: {x: 5, y: 7}
  - id: "tavern"
    name: "Tavern"
    position: {x: 12, y: 3}
  - id: "market"
    name: "Market"
    position: {x: 10, y: 8}
exits:
  - {target_scene: "forest_north", position: {x: 10, y: 0}, description: "Path to the northern forest"}
environment:
  lighting: "day_night"
  weather: "normal"
