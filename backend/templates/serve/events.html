<!-- Events 列表页 / Events listing page — 展示所有 tick events 时间线 / Show all tick events timeline -->
<!-- Jinja2 模板 / Jinja2 template — 循环渲染 events 卡片 / Loop render event cards -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Events — AIGameWorld</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.back { display: inline-block; color: #64748b; text-decoration: none; padding: 1rem 1.5rem; font-size: .85rem; }
.back:hover { color: #a855f7; }
header { padding: 0 1.5rem 1rem; border-bottom: 1px solid #334155; }
header h1 { font-size: 1.4rem; color: #22c55e; }
.card { background: #1e293b; border-radius: 6px; padding: 1.25rem; margin: .75rem 1.5rem; border: 1px solid #334155; max-width: 960px; }
.card .tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; }
.card .tag { padding: 2px 8px; border-radius: 4px; font-size: .75rem; border: 1px solid #334155; }
.card .narrative { color: #94a3b8; font-size: .85rem; margin-top: .5rem; white-space: pre-wrap; }
.empty { color: #64748b; padding: 2rem; text-align: center; }
</style>
</head>
<body>
<a href="/view" class="back">← Back</a>
<header><h1>All Events</h1></header>
{% if events %}
{% for e in events %}
<div class="card">
  <div class="tags">
    <span class="tag">Tick {{ e.tick }}</span>
    <span class="tag">{{ e.type }}</span>
    <span class="tag">{{ e.source }} → {{ e.target }}</span>
  </div>
  <div class="narrative">{{ e.narrative }}</div>
</div>
{% endfor %}
{% else %}<div class="empty">No events</div>{% endif %}
</body>
</html>
