[project]
name = "simgameworld-backend"
version = "0.1.0"
description = "SimGameWorld backend - DM-driven DND world simulation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-openai>=1.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "aiosqlite>=0.22",
    "chromadb>=1.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "mypy>=2.1",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
