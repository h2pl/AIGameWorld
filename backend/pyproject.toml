# AIGameWorld 后端项目配置 / Backend Project Config (PEP 621)
# 依赖版本锁定在 04-tech-stack.md 中说明 / Versions documented in 04-tech-stack.md

[project]
name = "AIGameWorld-backend"
version = "0.1.0"
description = "AIGameWorld backend - DM-driven DND world simulation"
requires-python = ">=3.14"

# === 运行时依赖 / Runtime Dependencies ===
dependencies = [
    "fastapi>=0.138",               # REST + WebSocket 网关 / API gateway
    "uvicorn[standard]>=0.49",      # ASGI 服务器 / ASGI server
    "langgraph>=1.2",               # 7 Phase StateGraph 编排 / Graph orchestration
    "langchain>=1.3",               # LLM 调用抽象层 / LLM abstraction
    "langchain-openai>=1.3",        # DeepSeek 接入（OpenAI 兼容）/ DeepSeek via OpenAI compat
    "langchain-anthropic>=0.3",     # Claude 备用模型 / Fallback LLM
    "pydantic>=2.13",               # 强类型数据模型 / Strong type validation
    "pydantic-settings>=2.14",      # 配置管理 / Config management
    "aiosqlite>=0.22",              # 异步 SQLite / Async SQLite
    "chromadb>=1.5",                # 向量记忆存储 / Vector memory
    "jinja2>=3.1",                  # Prompt 模板引擎 / Prompt templates
    "pyyaml>=6.0",                  # Pack YAML 解析 / Pack YAML parsing
    "langfuse>=4.12",               # LLM 可观测性 / LLM observability
]

# === 开发依赖 / Dev Dependencies ===
[dependency-groups]
dev = [
    "ruff>=0.15",                   # Lint + Format / Lint and format
    "pytest>=9.1",                  # 测试框架 / Test framework
    "pytest-asyncio>=1.4",          # 异步测试支持 / Async test support
    "pytest-cov>=7.1",              # 覆盖率 / Coverage
    "mypy>=2.1",                    # 类型检查 / Type checking
    "httpx>=0.28.1",                # HTTP 测试客户端 / HTTP test client
]

# === 生产扩展 / Production Extensions ===
production = [
    "langchain-mcp-adapters>=0.3",  # MCP 协议接入（远期）/ MCP protocol (future)
]

# === Ruff Lint 配置 / Ruff Lint Config ===
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

# === Mypy 类型检查配置 / Mypy Type Check Config ===
[tool.mypy]
python_version = "3.14"
strict = true                        # 严格模式 / Strict mode
warn_return_any = true
warn_unused_configs = true

# === Pytest 配置 / Pytest Config ===
[tool.pytest.ini_options]
asyncio_mode = "auto"               # 自动异步模式 / Auto async mode
testpaths = ["tests"]               # 测试目录 / Test directory
addopts = "-v --tb=short"           # 详细输出 + 短回溯 / Verbose + short traceback

# === 覆盖率配置 / Coverage Config ===
[tool.coverage.run]
source = ["src"]

# Pyright 配置已统一到项目根 pyrightconfig.json
