# AIGameWorld 主配置文件 / Main configuration file
# 所有 LLM API Key 通过环境变量注入，不写在此文件中 / API keys via env vars

# === 服务器 / Server ===
server:
  host: "0.0.0.0"                    # 监听地址 / Listen address
  port: 8000                          # 端口 / Port

# === 世界 / World ===
world:
  default_pack: "forgotten_realms"    # 默认 Pack 名称 / Default pack name

# === LLM 配置 / LLM Configuration ===
# 支持 OpenAI-compatible API：DeepSeek / GLM / ZenProxy
# API Key 通过环境变量注入：DEEPSEEK_API_KEY / GLM_API_KEY / ANTHROPIC_API_KEY
llm:
  providers:
    primary:                          # 默认提供商（被 base_url 覆盖时无效）
      type: "openai"
      base_url: "https://api.deepseek.com/v1"

  # DM 创造情境（强推理模型）
  dm_create:
    model: "deepseek-reasoner"
    # base_url: "https://open.bigmodel.cn/api/paas/v4"     # GLM-5.2
    # base_url: "http://localhost:8080/v1"                  # ZenProxy
    temperature: 0.9
    timeout: 15
    retries: 1

  # DM 叙事（快模型）
  dm_narrate:
    model: "deepseek-chat"
    # model: "glm-4-flash"                                  # GLM-5.2 快模型
    # base_url: "http://localhost:8080/v1"                  # ZenProxy
    temperature: 0.8
    timeout: 10
    retries: 1

  # PC 决策（中模型）
  pc_decision:
    model: "deepseek-chat"
    temperature: 0.7
    timeout: 10
    retries: 1

  # Actor 决策（快模型——降低成本）
  actor_decision:
    model: "deepseek-chat"
    temperature: 0.7
    timeout: 8
    retries: 1

  # 角色反思（强推理模型）
  reflection:
    model: "deepseek-reasoner"
    temperature: 0.5
    timeout: 15
    retries: 1

# === 数据库 / Database ===
database:
  sqlite_path: "data/world.db"        # SQLite 数据库路径 / SQLite path
  chroma_path: "data/chroma/"         # ChromaDB 数据目录 / ChromaDB data dir

# === 自动运行 / Auto Run ===
auto_run:
  default_interval: 2000              # 默认 tick 间隔（毫秒）/ Default tick interval (ms)

# === 可观测性 / Observability ===
observability:
  langfuse:
    enabled: true                     # 启用 Langfuse Tracing / Enable Langfuse
    # 环境变量：LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_BASE_URL
    # 自托管时 base_url 指向 Docker 部署的 Langfuse / Self-hosted base_url → Docker
    tracing_environment: "development"
