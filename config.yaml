# AIGameWorld 主配置文件 / Main configuration file
# 切换 LLM Provider：设置环境变量 LLM_PROVIDER=glm|deepseek|zen-proxy，或改 llm_provider 字段

# === 服务器 / Server ===
server:
  host: "0.0.0.0"
  port: 8000

# === 世界 / World ===
world:
  default_pack: "forgotten_realms"

# === LLM Provider 配置（只管"连到哪"）===
llm_provider: "deepseek"             # 默认 provider，环境变量 LLM_PROVIDER 可覆盖

llm_providers:
  zen-proxy:
    model: "deepseek-v4-flash-free"       # 默认模型，切 provider 自动换
    base_url: "http://localhost:6446/v1"
    api_key_env: ""                       # Zen Proxy 不需要 API key
    client_backend: "requests"
  glm:
    model: "glm-5.1"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "GLM_API_KEY"
    client_backend: "langchain"
  deepseek:
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    client_backend: "langchain"

# === LLM Purpose 配置（只管"怎么调"，只写一份，不随 provider 切换而改动）===
# model 从 provider 继承，不需要在这里写
llm_purposes:
  dm_create:
    temperature: 0.9
    timeout: 20
    retries: 1
  dm_narrate:
    temperature: 0.8
    timeout: 30
    retries: 1
  pc_decision:
    temperature: 0.7
    timeout: 10
    retries: 1
  actor_decision:
    temperature: 0.7
    timeout: 8
    retries: 1
  reflection:
    temperature: 0.5
    timeout: 15
    retries: 1

# === 数据库 / Database ===
database:
  sqlite_path: "data/test.db"         # src 代码生产 DB
  test_sqlite_path: "data/test.db"        # 测试专用 DB
  chroma_path: "data/chroma/"

# === 自动运行 / Auto Run ===
auto_run:
  default_interval: 2000
  reflection_interval: 5

# === 日志 / Logging ===
logging:
  json_format: true                 # true=JSON输出 false=文本输出
  console:                          # 控制台输出开关（true=开启）
    # 主流程
    api: true                       #   FastAPI 请求
    orchestrator: true              #   编排器
    graph: true                     #   Graph 节点
    service: true                   #   业务服务层
    engine: true                    #   引擎层
    repo: true                      #   数据仓储层
    storage: true                   #   存储层

    # 额外
    llm: true                       #   LLM 调用
    scheduler: true                 #   定时任务
    utils: true                     #   工具模块
    loader: true                    #   World Pack 加载
    viewer: true                    #   DB 查看器

    # 性能
    performance: false               #   node 耗时 + tick 总耗时

# === Mock 模式 / Mock mode ===
mock:
  enabled: true               # 开启后所有 LLM 调用返回预定义 mock 数据
  dataset: "tavern"           # 数据集名称：tavern / combat

# === 可观测性 / Observability ===
observability:
  langfuse:
    enabled: false
    tracing_environment: "development"
