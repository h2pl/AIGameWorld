# AIGameWorld 主配置文件 / Main configuration file
# 切换 LLM Provider：设置环境变量 LLM_PROVIDER=glm|deepseek|zen-proxy，或改 llm_provider 字段

# === 服务器 / Server ===
server:
  host: "0.0.0.0"
  port: 8000

# === 世界 / World ===
world:
  default_pack: "forgotten_realms"

# === LLM Provider 配置（只管"连到哪"）===
llm_provider: "zen-proxy"             # 默认 provider，环境变量 LLM_PROVIDER 可覆盖

llm_providers:
  zen-proxy:
    base_url: "http://localhost:6446/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    client_backend: "requests"            # Zen Proxy 用 requests（httpx 不兼容）
  glm:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "GLM_API_KEY"
    client_backend: "langchain"
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    client_backend: "langchain"

# === LLM Purpose 配置（只管"怎么调"，只写一份，不随 provider 切换而改动）===
llm_purposes:
  dm_create:
    model: "deepseek-v4-flash-free"       # 切换 provider 时需改模型名
    temperature: 0.9
    timeout: 20
    retries: 1
  dm_narrate:
    model: "deepseek-v4-flash-free"
    temperature: 0.8
    timeout: 30
    retries: 1
  pc_decision:
    model: "deepseek-v4-flash-free"
    temperature: 0.7
    timeout: 10
    retries: 1
  actor_decision:
    model: "deepseek-v4-flash-free"
    temperature: 0.7
    timeout: 8
    retries: 1
  reflection:
    model: "deepseek-v4-flash-free"
    temperature: 0.5
    timeout: 15
    retries: 1

# === 数据库 / Database ===
database:
  sqlite_path: "data/world.db"
  chroma_path: "data/chroma/"

# === 自动运行 / Auto Run ===
auto_run:
  default_interval: 2000
  reflection_interval: 5

# === 可观测性 / Observability ===
observability:
  langfuse:
    enabled: false
    tracing_environment: "development"
