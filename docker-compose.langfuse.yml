# Langfuse 自托管 / Langfuse self-hosted
# 启动方式 / Usage: docker compose -f docker-compose.langfuse.yml up -d
# 面板地址 / Dashboard: http://localhost:3000
# 首次访问需注册账号，然后在 Settings → API Keys 创建密钥
# 将密钥填入 .env 文件的 LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY

services:
  langfuse:
    image: langfuse/langfuse:3
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: aigameworld-langfuse-secret-2026
      SALT: aigameworld-langfuse-salt-2026
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:15-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data

volumes:
  langfuse-db-data:
